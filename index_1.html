<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PC Mentor</title>
  <meta name="description" content="Your AI assistant to buy, fix and upgrade your PC. Answers in your language.">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
  <style>
    :root { --bg:#0b1220; --card:#121a2e; --line:#223055; --text:#e8eefc; --muted:#93a1c4; --accent:#3b82f6; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
           display: flex; flex-direction: column; }
    header { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 18px; margin: 0; flex: 1; }
    header small { color: var(--muted); display: block; font-weight: 400; font-size: 12px; }
    button { font: inherit; cursor: pointer; }
    #newchat { background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
    #chat { flex: 1; overflow-y: auto; padding: 16px; max-width: 820px; width: 100%; margin: 0 auto; }
    .msg { margin: 10px 0; padding: 10px 14px; border-radius: 12px; line-height: 1.55; max-width: 92%; overflow-x: auto; }
    .user { background: var(--accent); margin-inline-start: auto; }
    .bot { background: var(--card); border: 1px solid var(--line); }
    .bot table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 14px; }
    .bot th, .bot td { border: 1px solid var(--line); padding: 6px 8px; text-align: start; }
    .bot th { background: #182243; }
    .bot a { color: #7db2ff; }
    .shops { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
    .shops .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; }
    .shops a { background: #182243; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; text-decoration: none; color: var(--text); }
    .quick { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    .quick button { background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; }
    .quick button:hover { border-color: var(--accent); }
    form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); max-width: 820px; width: 100%; margin: 0 auto; }
    #msg { flex: 1; background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font: inherit; }
    #send { background: var(--accent); color: white; border: 0; border-radius: 10px; padding: 0 18px; }
    #send:disabled { opacity: .5; cursor: not-allowed; }
    footer { text-align: center; color: var(--muted); font-size: 12px; padding: 0 12px 10px; }
  </style>
</head>
<body>
  <header>
    <h1>🖥️ PC Mentor <small>Buy, fix and upgrade your PC</small></h1>
    <button id="newchat" type="button">New chat</button>
  </header>

  <div id="chat"></div>

  <form id="form" autocomplete="off">
    <input id="msg" dir="auto" maxlength="500" placeholder="Type your question... / Ekteb houni... / اكتب هنا...">
    <button id="send" type="submit">Send</button>
  </form>
  <footer>AI can make mistakes. Prices are estimates: always check them in the shops.</footer>

  <script>
    // Your Supabase Edge Function URL
    const API_URL = "https://pmfcnnxukeqrhlhgyrfo.supabase.co/functions/v1/pc-agent";

    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("msg");
    const sendBtn = document.getElementById("send");
    let history = [];
    let busy = false;

    function scrollDown() { chat.scrollTop = chat.scrollHeight; }

    function addMessage(role, html, plain) {
      const d = document.createElement("div");
      d.className = "msg " + (role === "user" ? "user" : "bot");
      d.dir = "auto";
      if (html) d.innerHTML = html; else d.textContent = plain || "";
      chat.appendChild(d);
      scrollDown();
      return d;
    }

    function welcome() {
      chat.innerHTML = "";
      history = [];
      addMessage("bot", null, "Hi! 👋 Tell me what you need. Marhba! Ekteb chnouwa t7eb. Bonjour ! Dis-moi ce dont tu as besoin. I answer in your language.");
      const q = document.createElement("div");
      q.className = "quick";
      [
        ["🛒 I want to buy a part", "I want to buy a PC part"],
        ["🩺 My PC has a problem", "My PC has a problem"],
        ["⚡ Upgrade my PC", "How can I upgrade my PC?"]
      ].forEach(([label, text]) => {
        const b = document.createElement("button");
        b.type = "button"; b.textContent = label;
        b.onclick = () => { q.remove(); send(text); };
        q.appendChild(b);
      });
      chat.appendChild(q);
    }

    // Turn "SEARCH:" and "COUNTRY:" lines into shop buttons
    function extractShops(text) {
      const s = text.match(/^\s*SEARCH:\s*(.+)$/mi);
      const c = text.match(/^\s*COUNTRY:\s*(.+)$/mi);
      const clean = text.replace(/^\s*SEARCH:.*$/mi, "").replace(/^\s*COUNTRY:.*$/mi, "").trim();
      const models = s ? s[1].split("|").map(x => x.trim()).filter(Boolean).slice(0, 4) : [];
      return { clean, models, country: c ? c[1].trim() : "" };
    }

    function shopsBlock(models, country) {
      if (!models.length) return null;
      const g = q => "https://www.google.com/search?q=" + encodeURIComponent(q);
      const isTn = /tunis|^tn$|تونس/i.test(country);
      const wrap = document.createElement("div");
      wrap.className = "shops";
      const title = document.createElement("div");
      title.textContent = "🔎 Check the real price:";
      wrap.appendChild(title);
      models.forEach(m => {
        const row = document.createElement("div");
        row.className = "row";
        const name = document.createElement("strong");
        name.textContent = m;
        row.appendChild(name);
        const links = isTn
          ? [["Mytek", m + " site:mytek.tn"], ["Tunisianet", m + " site:tunisianet.com.tn"], ["Scoop", m + " site:scoop.com.tn"]]
          : [["Google", m + " price " + country]];
        links.forEach(([label, q]) => {
          const a = document.createElement("a");
          a.href = g(q); a.target = "_blank"; a.rel = "noopener noreferrer"; a.textContent = label;
          row.appendChild(a);
        });
        wrap.appendChild(row);
      });
      return wrap;
    }

    async function send(text) {
      if (busy) return;
      text = (text || "").trim();
      if (!text) return;
      busy = true; sendBtn.disabled = true;
      document.querySelectorAll(".quick").forEach(e => e.remove());
      addMessage("user", null, text);
      history.push({ role: "user", content: text });
      const wait = addMessage("bot", null, "...");
      try {
        const r = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history.slice(-10) })
        });
        const d = await r.json();
        const out = d.output || "No answer.";
        const { clean, models, country } = extractShops(out);
        wait.innerHTML = DOMPurify.sanitize(marked.parse(clean));
        const block = shopsBlock(models, country);
        if (block) wait.appendChild(block);
        if (r.ok) history.push({ role: "assistant", content: clean });
        else history.pop();
      } catch (e) {
        wait.textContent = "Connection error. Please try again.";
        history.pop();
      }
      busy = false; sendBtn.disabled = false; input.focus(); scrollDown();
    }

    form.addEventListener("submit", e => { e.preventDefault(); const t = input.value; input.value = ""; send(t); });
    document.getElementById("newchat").onclick = welcome;
    welcome();
  </script>
</body>
</html>
